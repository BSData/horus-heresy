name: Generate BattleScribe Index

on:
  push:
    branches:
      - main # Change this to 'master' if your repo uses the older default branch name

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the action permission to commit the index file back to your repo

    steps:
      - name: Checkout Repository Content
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Run BattleScribe Indexer Jar
        run: |
          curl -L -o battlescribe-data-indexer.jar "https://battlescribe.net"
          java -jar battlescribe-data-indexer.jar .
          rm battlescribe-data-indexer.jar



      - name: Commit and Push Updated Index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "automated: update index.bsi"
