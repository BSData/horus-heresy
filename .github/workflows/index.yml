name: Generate BattleScribe Index

on:
  push:
    branches:
      - main # Change this to 'master' if your repo uses the older default branch name

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the action permission to commit the index file back to your repo

    steps:
      - name: Checkout Repository Content
        uses: actions/checkout@v4

      - name: Download and Run Community Indexer
        run: |
          curl -L -o bsdata-indexer "https://github.com"
          chmod +x bsdata-indexer
          ./bsdata-indexer .
          rm bsdata-indexer

      - name: Commit and Push Updated Index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "automated: update index.bsi"
